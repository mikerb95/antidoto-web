name: Vista previa en Cloudflare Pages

# Sube dist/ a Cloudflare Pages en cada push. Cada rama tiene su URL de vista previa
# (<rama>.antidoto-web.pages.dev) y main publica en antidoto-web.pages.dev.
# Secrets requeridos en GitHub (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token con permiso "Account > Cloudflare Pages > Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID de la cuenta (dash.cloudflare.com, panel derecho de la cuenta)
# Sin los secrets el job se omite con un aviso, para no dejar el CI en rojo.

on:
  push:
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROYECTO: antidoto-web

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; no se publica la vista previa."
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm ci
      # Con la variable PUBLIC_API_URL el cotizador guarda leads en la API; sin ella solo abre WhatsApp.
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: npm run build
      # La primera vez crea el proyecto con main como rama de producción; después ya existe.
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages project create "$PROYECTO" --production-branch=main || echo "El proyecto ya existe."
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        id: deploy
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name="$PROYECTO" --branch="${GITHUB_REF_NAME}" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Vista previa de ${GITHUB_REF_NAME}: ${URL}" >> "$GITHUB_STEP_SUMMARY"
