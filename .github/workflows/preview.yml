name: Vista previa

# Vercel: cada push ya tiene su vista previa por la integración de Git. El job "vercel" solo corre
# a mano o cuando el panel publica contenido en vista previa (workflow_dispatch): vuelve a
# construir main sin un commit. Necesita VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID
# (ver deploy.yml).
# Cloudflare Pages (job "preview", mientras dure la migración a Vercel): sube dist/ en cada push.
# Cada rama tiene su URL (<rama>.antidoto-web.pages.dev) y main publica en antidoto-web.pages.dev.
# Necesita CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) y CLOUDFLARE_ACCOUNT_ID. Para apagarlo,
# borra esos secrets.
# Sin sus secrets, cada job se omite con un aviso, para no dejar el CI en rojo.

on:
  push:
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROYECTO: antidoto-web

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; no se publica la vista previa."
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm ci
      # Con la variable PUBLIC_API_URL el cotizador guarda leads en la API; sin ella solo abre WhatsApp.
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: npm run build
      # La primera vez crea el proyecto con main como rama de producción; después ya existe.
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages project create "$PROYECTO" --production-branch=main || echo "El proyecto ya existe."
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        id: deploy
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name="$PROYECTO" --branch="${GITHUB_REF_NAME}" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Vista previa de ${GITHUB_REF_NAME}: ${URL}" >> "$GITHUB_STEP_SUMMARY"

  vercel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "::warning::Faltan VERCEL_TOKEN, VERCEL_ORG_ID o VERCEL_PROJECT_ID; no se publica la vista previa en Vercel."
      - if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        uses: actions/checkout@v4
      - if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: npm ci
      - if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          npx --yes vercel@59 pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel@59 build --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@59 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Vista previa en Vercel: ${url}" >> "$GITHUB_STEP_SUMMARY"
