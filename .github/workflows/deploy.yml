name: Deploy a Hostinger

# Despliega dist/ por FTP a public_html. Manual (Actions > Deploy a Hostinger > Run workflow)
# hasta el lanzamiento: una fusión a main no debe reemplazar el sitio en producción.
# Secrets requeridos en GitHub (Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (hPanel > Archivos > Cuentas FTP)

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - if: env.FTP_SERVER == ''
        run: echo "::warning::Faltan los secrets FTP_SERVER, FTP_USERNAME y FTP_PASSWORD; no se despliega."
      - if: env.FTP_SERVER != ''
        uses: actions/checkout@v4
      - if: env.FTP_SERVER != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.FTP_SERVER != ''
        run: npm ci
      - if: env.FTP_SERVER != ''
        run: npm run build
      - if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
