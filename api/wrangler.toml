# API de Antídoto: leads del cotizador, bandeja en el admin y avisos de seguimiento.
# Secrets (wrangler secret put): RESEND_API_KEY, SAL_IP, RESEND_WEBHOOK_SECRET, ANTHROPIC_API_KEY, GITHUB_DISPATCH_TOKEN. Ver api/README.md.
name = "antidoto-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Panel de administración (Preact, api/admin/), construido por Vite con `npm run admin:build`.
# El Worker corre primero en toda ruta y sirve los archivos con su CSP (src/panel.ts).
[assets]
directory = "./dist-admin"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "antidoto"
# El workflow de despliegue crea la base si no existe y escribe aquí su id.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migraciones"

# Imágenes del contenido del sitio (blog, casos, clientes) que sube el equipo desde el panel.
# El workflow de despliegue crea el bucket si no existe.
[[r2_buckets]]
binding = "MEDIOS"
bucket_name = "antidoto-medios"

# Archivos de los entregables de proyectos. Privado: el Worker los sirve solo con sesión.
[[r2_buckets]]
binding = "ARCHIVOS"
bucket_name = "antidoto-archivos"

# Cada 5 minutos salen los lotes de campañas; cada hora, además, el aviso de leads sin respuesta.
[triggers]
crons = ["*/5 * * * *", "0 * * * *"]

[vars]
# "local" acepta orígenes localhost y cookies sin Secure; se cambia en .dev.vars.
ENTORNO = "produccion"
# Orígenes que pueden enviar leads (separados por coma).
ORIGENES = "https://antidotocolombia.com,https://antidoto-web.pages.dev"
# Las vistas previas de rama (*.antidoto-web.pages.dev) también se aceptan: ver src/cors.ts.
MAIL_FROM = "Antídoto <hola@antidotocolombia.com>"
MAIL_EQUIPO = "antidoto.colombia@outlook.com"
# Remitente de las campañas de novedades.
MAIL_FROM_NOVEDADES = "Antídoto <novedades@antidotocolombia.com>"
# Sitio público: ahí están las páginas de confirmación, baja y preferencias de novedades.
SITIO_URL = "https://antidotocolombia.com"
# Pie legal de las campañas (razón social y domicilio). Vacío: "Antídoto · ... · Colombia".
# MAIL_DIRECCION = "Antídoto S.A.S. · NIT ... · Calle ... · Ciudad, Colombia"
# Horas sin respuesta antes de avisar al equipo.
HORAS_SEGUIMIENTO = "24"
# Tope de gasto diario del chat con IA (USD). Si no se puede leer el gasto, el chat no responde.
ASESOR_TOPE_DIARIO_USD = "1"
# Repositorio del sitio: publicar desde el panel dispara sus workflows (secret GITHUB_DISPATCH_TOKEN).
GITHUB_REPO = "mikerb95/antidoto-web"
GITHUB_REF = "main"
